<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WannaBeSingers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background image: place your animated asset at assets/bg.gif (recommended small/optimized GIF or short MP4). If not present, a soft color is used. -->
  <div id="bg"></div>
  <div class="overlay"></div>

  <main>
    <h1>WannaBeSingers</h1>
    <p>Sing-along — 20 Hindi tracks people love to belt out in the shower.</p>

    <div class="controls">
      <button id="prev" title="Previous">◀ Prev</button>
      <button id="open" title="Open selected on YouTube">▶ Open</button>
      <button id="next" title="Next">Next ▶</button>
      <span id="now" aria-live="polite" style="margin-left:12px;color:#333"></span>
    </div>

    <ul id="playlist"></ul>

    <footer>
      <p>Click track buttons to open YouTube or Spotify in a new tab. Replace assets/bg.gif with the animated image you provide.</p>
    </footer>
  </main>

  <script>
    let playlist = [];
    let currentIndex = 0;

    function ytSearchUrl(q){
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    }
    function spSearchUrl(q){
      return 'https://open.spotify.com/search/' + encodeURIComponent(q);
    }

    function openCurrentOnYouTube(){
      if(!playlist.length) return;
      const q = playlist[currentIndex].query;
      window.open(ytSearchUrl(q),'_blank','noopener');
      updateNow();
    }

    function updateNow(){
      const el = document.getElementById('now');
      if(!playlist.length) el.textContent='';
      else el.textContent = (currentIndex+1) + '. ' + playlist[currentIndex].title;
    }

    document.getElementById('prev').addEventListener('click', ()=>{
      if(!playlist.length) return;
      currentIndex = (currentIndex -1 + playlist.length) % playlist.length;
      openCurrentOnYouTube();
    });
    document.getElementById('next').addEventListener('click', ()=>{
      if(!playlist.length) return;
      currentIndex = (currentIndex +1) % playlist.length;
      openCurrentOnYouTube();
    });
    document.getElementById('open').addEventListener('click', ()=>{
      openCurrentOnYouTube();
    });

    // Background load check (debug): tries to load assets/bg.png and shows a small notice if it fails.
    (function(){
      const img = new Image();
      img.onload = function(){
        console.log('Background image loaded');
        document.body.classList.add('bg-ok');
      };
      img.onerror = function(){
        console.warn('Background image failed to load');
        const b = document.createElement('div');
        b.style.position='fixed';b.style.left=0;b.style.right=0;b.style.top=0;b.style.padding='8px';b.style.background='rgba(255,60,60,0.95)';b.style.color='#fff';b.style.zIndex=9999;b.style.fontSize='13px';b.textContent='Background image failed to load. If you provided an animated GIF, try uploading it as assets/bg.gif instead.';
        document.body.appendChild(b);
      };
      img.src = 'assets/bg.png?cb=' + Date.now();
    })();

    fetch('playlist.json')
      .then(r=>r.json())
      .then(list => {
        playlist = list;
        const el = document.getElementById('playlist');
        el.innerHTML = '';
        list.forEach((item,i)=>{
          const li = document.createElement('li');

          const title = document.createElement('span');
          title.className = 'track-title';
          title.textContent = (i+1)+'. ' + item.title;
          title.addEventListener('click', ()=>{
            currentIndex = i; updateNow();
          });

          const btnYt = document.createElement('a');
          btnYt.href = ytSearchUrl(item.query);
          btnYt.target = '_blank';
          btnYt.rel = 'noopener';
          btnYt.className = 'icon-button';
          btnYt.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#FF0000" d="M10 15l5.19-3L10 9v6z"></path><path d="M21.8 8s-.2-1.4-.8-2c-.8-.8-1.7-.8-2.1-.9C14.2 4.7 12 4.7 12 4.7h-.1s-2.2 0-6.9.4c-.4 0-1.5.1-2.2.9-.6.6-.8 2-.8 2S1 10.1 1 12.2v.6C1 14.9 1.2 16 1.2 16s.2 1.4.8 2c.7.7 1.6.7 2 1 1.5.4 6.6.4 6.6.4s2.2 0 6.9-.4c.5-.1 1.6-.3 2.3-1 .6-.6.8-2 .8-2s.2-1.1.2-2.5v-.6c0-1.9-.2-2.9-.2-2.9z" fill="#FF0000"></path></svg>';

          const sep = document.createTextNode(' ');

          const btnSp = document.createElement('a');
          btnSp.href = spSearchUrl(item.query);
          btnSp.target = '_blank';
          btnSp.rel = 'noopener';
          btnSp.className = 'icon-button';
          btnSp.innerHTML = '<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#1ED760" d="M12 3C6.5 3 2 6.7 2 11c0 3.1 2.5 5.8 6.4 6.9.5.1.8-.2.8-.6v-2.1c-2.6.6-3.2-1.1-3.2-1.1-.4-1-1-1.2-1-1.2-.8-.6.1-.6.1-.6 1 .1 1.6 1 1.6 1 .8 1.4 2.2 1 2.7.8.1-.6.3-1 .5-1.2-2.1-.2-4.3-1.1-4.3-4.9 0-1.1.4-2.1 1-2.9-.1-.3-.4-1.2.1-2.4 0 0 .8-.2 2.8 1 .8-.2 1.6-.3 2.4-.3s1.6.1 2.4.3c2-1.2 2.8-1 2.8-1 .5 1.2.2 2.1.1 2.4.6.8 1 1.8 1 2.9 0 3.8-2.2 4.7-4.3 4.9.3.3.6.8.6 1.6v2.4c0 .4.3.7.8.6C19.5 16.8 22 14.1 22 11c0-4.3-4.5-8-10-8z"></path></svg>';

          li.appendChild(title);
          li.appendChild(sep);
          li.appendChild(btnYt);
          li.appendChild(document.createTextNode(' '));
          li.appendChild(btnSp);

          el.appendChild(li);
        });
        updateNow();
      })
      .catch(()=>{
        document.getElementById('playlist').textContent = 'Could not load playlist.';
      });
  </script>
</body>
</html>
