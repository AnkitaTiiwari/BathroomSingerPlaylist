<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>WannaBeSingers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background image: place your animated asset at assets/bg.gif (recommended small/optimized GIF or short MP4). If not present, a soft color is used. -->
  <div id="bg"></div>
  <div class="overlay"></div>

  <main>
    <div class="controls big" role="region" aria-label="Playback controls">
      <button id="prev" title="Previous" aria-label="Previous track">◀</button>
      <button id="open" title="Open selected on YouTube" aria-label="Open track">▶</button>
      <button id="next" title="Next" aria-label="Next track">▶</button>
      <div id="now" class="now" aria-live="polite" style="margin-left:18px"></div>
    </div>
  </main>

  <script>
    let playlist = [];
    let currentIndex = 0;

    function ytSearchUrl(q){
      return 'https://www.youtube.com/results?search_query=' + encodeURIComponent(q);
    }
    function spSearchUrl(q){
      return 'https://open.spotify.com/search/' + encodeURIComponent(q);
    }

    function openCurrentOnYouTube(){
      if(!playlist.length) return;
      const q = playlist[currentIndex].query;
      window.open(ytSearchUrl(q),'_blank','noopener');
      updateNow();
    }

    function updateNow(){
      const el = document.getElementById('now');
      if(!playlist.length) el.textContent='';
      else el.textContent = (currentIndex+1) + '. ' + playlist[currentIndex].title;
    }

    document.getElementById('prev').addEventListener('click', ()=>{
      if(!playlist.length) return;
      currentIndex = (currentIndex -1 + playlist.length) % playlist.length;
      openCurrentOnYouTube();
    });
    document.getElementById('next').addEventListener('click', ()=>{
      if(!playlist.length) return;
      currentIndex = (currentIndex +1) % playlist.length;
      openCurrentOnYouTube();
    });
    document.getElementById('open').addEventListener('click', ()=>{
      openCurrentOnYouTube();
    });

    // Background load check (silent): tries assets/bg.png then assets/bg.gif; logs only to console (no visible banner).
    (function(){
      function tryLoad(src){
        return new Promise((resolve,reject)=>{
          const img = new Image();
          img.onload = ()=>resolve(src);
          img.onerror = ()=>reject(src);
          img.src = src + '?cb=' + Date.now();
        });
      }
      tryLoad('assets/bg.png')
        .then(s=>console.log('Background image loaded:', s))
        .catch(()=>{
          console.warn('assets/bg.png failed, trying assets/bg.gif');
          return tryLoad('assets/bg.gif');
        })
        .then(s=>console.log('Background image loaded:', s))
        .catch(()=>console.warn('No background image loaded'));
    })();

    fetch('playlist.json')
      .then(r=>r.json())
      .then(list => {
        playlist = list;
        // do not render full list; controls and now-playing are shown only
        if(!playlist.length){
          document.getElementById('now').textContent = 'No tracks available.';
        } else {
          currentIndex = 0;
          updateNow();
        }
      })
      .catch(()=>{
        document.getElementById('now').textContent = 'Could not load playlist.';
      });
  </script>
</body>
</html>
